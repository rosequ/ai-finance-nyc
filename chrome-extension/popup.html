<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Terms & Conditions Analyzer</title>
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 18px;
            margin: 0;
            color: #333;
        }
        
        .analyze-btn {
            width: 100%;
            padding: 12px;
            background: #007cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .analyze-btn:hover {
            background: #0056cc;
        }
        
        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .content-area {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
        
        .page-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        
        .page-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .page-url {
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 Terms & Conditions Analyzer</h1>
    </div>
    
    <div class="page-info" id="page-info">
        <div class="page-title" id="page-title">Loading...</div>
        <div class="page-url" id="page-url">-</div>
    </div>
    
    <button class="analyze-btn" id="analyze-btn">
        🔍 Analyze Terms & Conditions
    </button>
    
    <div class="loading" id="loading">
        <div>⏳ Extracting page content...</div>
    </div>
    
    <div class="error" id="error">
        <div id="error-text">Something went wrong</div>
    </div>
    
    <div class="content-area" id="content-area"></div>

    <script src="popup.js"></script>
</body>
</html>
