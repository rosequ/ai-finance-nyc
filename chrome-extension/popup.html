<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms & Conditions Analyzer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">📋</span>
                <h1>T&C Analyzer</h1>
            </div>
            <div class="status-indicator" id="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Current Page Analysis -->
            <div class="section">
                <h2>Current Page</h2>
                <div class="page-info" id="page-info">
                    <div class="page-title" id="page-title">Loading...</div>
                    <div class="page-url" id="page-url">-</div>
                </div>
                
                <div class="analysis-result" id="analysis-result" style="display: none;">
                    <div class="result-header">
                        <div class="result-status" id="result-status">
                            <span class="result-icon" id="result-icon">⚠</span>
                            <span class="result-text" id="result-text">Not a Terms Page</span>
                        </div>
                        <div class="result-confidence" id="result-confidence">0%</div>
                    </div>
                    <div class="result-summary" id="result-summary"></div>
                    <div class="result-details" id="result-details"></div>
                </div>

                <div class="actions">
                    <button class="btn btn-secondary" id="test-connection" style="margin-bottom: 8px;">
                        <span class="btn-icon">🧪</span>
                        Test Connection
                    </button>
                    <button class="btn btn-primary" id="analyze-current">
                        <span class="btn-icon">🔍</span>
                        Review T&C
                    </button>
                    <button class="btn btn-secondary" id="highlight-terms" style="display: none;">
                        <span class="btn-icon">🎯</span>
                        Highlight Terms
                    </button>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div class="loading" id="loading" style="display: none;">
                <div class="loading-spinner"></div>
                <div class="loading-text">Analyzing...</div>
            </div>

            <!-- Error Display -->
            <div class="error" id="error" style="display: none;">
                <div class="error-icon">⚠️</div>
                <div class="error-text" id="error-text">Something went wrong</div>
                <button class="btn btn-small" id="retry-btn">Retry</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-links">
                <button class="link-btn" id="settings-btn">⚙️ Settings</button>
                <button class="link-btn" id="help-btn">❓ Help</button>
            </div>
            <div class="footer-info">
                <span class="version">v1.0</span>
                <span class="api-status" id="api-status">
                    <span class="api-dot"></span>
                    API Ready
                </span>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Settings</h3>
                <button class="modal-close" id="settings-close">×</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="api-url">API Base URL:</label>
                    <input type="url" id="api-url" value="http://localhost:8000" class="setting-input">
                </div>
                <div class="setting-group">
                    <label for="auto-analyze">Auto-analyze pages:</label>
                    <input type="checkbox" id="auto-analyze" checked>
                </div>
                <div class="setting-group">
                    <label for="show-overlay">Show analysis overlay:</label>
                    <input type="checkbox" id="show-overlay" checked>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="save-settings">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
